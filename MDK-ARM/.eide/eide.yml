version: "4.1"
name: f103
type: ARM
deviceName: STM32F103ZE
packDir: .pack/Keil/STM32F1xx_DFP.2.3.0
srcDirs:
  - ../Application
  - ../Bsp
  - ../Config
  - ../Core
  - ../Drivers
  - ../Middleware
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: startup
      files:
        - path: startup_stm32f103xe.s
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 251ad20e559fc81d103abdec1cc737c4
targets:
  f103:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32F103xE
        - STM32F10X_HD
      incList:
        - ../Core
        - ../Drivers/STM32F1xx_HAL_Driver/Inc
        - ../Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
        - ../Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - ../Drivers/CMSIS/Include
        - .cmsis/include
        - RTE/_f103
        - ../Application/Inc
        - ../Bsp/Inc
        - ../Config/Inc
        - ../Core/Inc
        - ../Drivers
        - .
        - ../Middleware/Inc
      libList: []
    excludeList:
      - ../Drivers/CMSIS/Core_A
      - ../Drivers/CMSIS/DSP
      - ../Drivers/CMSIS/Core/Template
      - ../Drivers/CMSIS/docs
      - ../Drivers/CMSIS/Lib
      - ../Drivers/CMSIS/NN
      - ../Drivers/CMSIS/RTOS
      - ../Drivers/CMSIS/RTOS2
      - ../Drivers/CMSIS/Core
      - ../Drivers/CMSIS/Device/ST/STM32F1xx/Source
      - ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_timebase_rtc_alarm_template.c
      - ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_msp_template.c
      - ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_timebase_tim_template.c
    settings:
      debugger: cortex-debug
    toolchain: AC5
    toolchainConfigMap:
      AC5:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 4
          afterBuildTasks: []
          asm-compiler:
            defines: []
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: --diag_suppress=1 --diag_suppress=1295
            C_FLAGS: --diag_suppress=1 --diag_suppress=1295
            c99-mode: true
            one-elf-section-per-function: true
            optimization: level-3
            warnings: all-warnings
          global:
            output-debug-info: enable
            use-microLIB: false
          linker:
            $outputTaskExcludes:
              - .bin
            output-format: elf
            ro-base: ""
            rw-base: ""
            xo-base: ""
        scatterFilePath: ""
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x00010000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x00080000"
                startAddr: "0x08000000"
              tag: IROM
        useCustomScatterFile: false
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/f103.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
    uploader: STLink
